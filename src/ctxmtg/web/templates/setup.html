{% extends "base.html" %}
{% block title %}Setup{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div style="max-width: 380px; margin: 5rem auto;">
    <div class="card">
        <h1 style="text-align: center; margin-bottom: 0.5rem;">The_Borg_DB</h1>
        <p style="text-align: center; color: var(--muted); margin-bottom: 1.5rem; font-size: 0.9rem;">
            Set an admin password for the command center.
        </p>
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form method="post" action="/setup">
            <div class="form-group">
                <label for="password">Password (min 8 characters)</label>
                <input type="password" id="password" name="password" required minlength="8" autofocus>
            </div>
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Set Password</button>
        </form>
    </div>
</div>
{% endblock %}
